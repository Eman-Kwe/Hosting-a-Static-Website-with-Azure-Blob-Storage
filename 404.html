<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found</title>
<style>
  :root {
    --azure-blue: #0078d4;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(135deg, #e8f1fb 0%, #f7f9fc 55%, #eef4f9 100%);
  }
  .card {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 16px;
    padding: 48px 40px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    max-width: 480px;
    margin: 20px;
    animation: fadeIn 0.8s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  h1 {
    color: var(--azure-blue);
    margin: 0 0 12px;
    font-size: 2rem;
  }
  p {
    color: #333;
    line-height: 1.5;
    margin: 8px 0;
  }
  a {
    display: inline-block;
    margin-top: 18px;
    padding: 7px 16px;
    border-radius: 999px;
    background: #eaf3fc;
    color: var(--azure-blue);
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  a:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0, 120, 212, 0.25);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>404: Page Not Found</h1>
    <p>That page doesn't exist on this site. The address may be mistyped, or the file was never uploaded.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
